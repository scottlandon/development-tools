# Supply-chain policy, checked in CI by cargo-deny: https://embarkstudios.github.io/cargo-deny/

[graph]
# Only the platforms we ship binaries for.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

[advisories]
# Known vulnerabilities and unmaintained crates fail the build.
unmaintained = "workspace"
yanked = "deny"

[licenses]
# Permissive licences only. Anything else has to be added here on purpose.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# cc-usage promises to make no network connections. Nothing that can open one belongs in the tree,
# so an HTTP client, a TLS stack or an async network runtime fails CI even as a transitive dependency.
deny = [
    { crate = "reqwest" },
    { crate = "hyper" },
    { crate = "h2" },
    { crate = "ureq" },
    { crate = "curl" },
    { crate = "isahc" },
    { crate = "attohttpc" },
    { crate = "surf" },
    { crate = "openssl" },
    { crate = "native-tls" },
    { crate = "rustls" },
    { crate = "tokio" },
    { crate = "async-std" },
    { crate = "socket2" },
    { crate = "tungstenite" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
