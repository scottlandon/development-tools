# Third-party licence notices for release archives, generated by cargo-about:
# https://embarkstudios.github.io/cargo-about/  (see the `notices` job in .github/workflows/release.yml)

# Keep this list identical to [licenses].allow in deny.toml. deny.toml is the gate; this file only
# decides what cargo-about is willing to print.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]

# Only the platforms we ship binaries for; keep identical to [graph].targets in deny.toml.
targets = [
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
]

# Dev-dependencies (test helpers) are not compiled into the shipped binary.
ignore-dev-dependencies = true
ignore-build-dependencies = false
